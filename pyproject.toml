[project]
name = "clearwater_riverine"
dynamic = ["version", "readme"]
description = "Clearwater Python transport model"
authors = [
    {name = "Todd Steissberg", email = "Todd.E.Steissberg@erdc.dren.mil"},
]


###############
### Build 
###############
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "./src/clearwater_riverine/__init__.py"

[tool.hatch.readme]
path = "./README.md"

[tool.hatch.metadata]
allow-direct-references = true


########################
### Pixi 
########################

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.11"
scipy = "*"
numba = "*"
dask = "*"
xarray = "*"
cf-xarray = "*"
h5py = "*"
hdf5plugin = "*"
gridgeo = "*"
netCDF4 = "*"
zarr = "*"
numcodecs = "*"
bottleneck = "*"
geopandas = "*"
geoviews = "*"
spatialpandas = "*"
fastparquet = "*"
xarray-simlab = "*"
hvplot = "*"
panel  = "*"
cmasher = "*"
param = "*"
jupyterlab  = "*"
ipympl = "*"
ipywidgets = "*"
jupyter_bokeh = "*"
pyviz_comms = "*"
selenium = "*"
geckodriver = "*"

[tool.pixi.pypi-dependencies]
clearwater_riverine = { path = ".", editable = true }


#############################
### Pixi Dev Environment
#############################

[tool.pixi.environments]
dev = ["dev"]

[tool.pixi.feature.dev.dependencies]
pytest = "*"
pytest-cov = "*"
pyright = "*"
snakeviz = "*"
python-lsp-server = "*"
pylsp-mypy = "*"
jupyterlab-lsp = "*"

[tool.pixi.feature.dev.pypi-dependencies]
clearwater_riverine = { path = ".", editable = true }
clearwater_data = { path = "../ClearWater-data", editable = true }

[tool.pixi.tasks]
