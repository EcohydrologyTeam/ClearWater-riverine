model:
  # Simulation workspace directory, absolute or relative 
  # to current working directory of the running process (i.e. notebook)
  simulation_directory: data/sumwere_creek_coarse/
  hydrodynamic_input: clearWaterTestCases.p48.hdf
  crs: EPSG:26916
  start_datetime: 2022-05-13 08:00
  end_datetime: 2022-05-13 10:00
  # chunk_size: 4h
  diffusion_coefficient: 0.1
  output_variables: ["water_temperature", "tracer"]
  mass_flux_calculation: true
  calculated_variables:
    wetted_surface_area: false
    average_depth: false
    maximum_depth: false
constituents:
  water_temperature:
    initial_conditions:
      provider: csv
      data: 
        file_path: cwr_initial_conditions_temp.csv
        spatial_field: Cell_Index
    boundary_conditions:
      provider: csv
      data:
        file_path: cwr_boundary_conditions_temp.csv
        time_field: Datetime
        spatial_field: RAS2D_TS_Name
    units: degC
  tracer:
    initial_conditions:
      provider: float
      data:
        value: 100
    boundary_conditions:
      provider: float
      data:
        value: 100
